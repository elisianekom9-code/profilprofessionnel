<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elisiane KOM FEUM - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .selection-blue::selection { background: #dbeafe; color: #1e3a8a; }
    </style>
</head>
<body class="selection-blue">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // Composant Icône pour remplacer lucide-react dans le navigateur
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [activeSection, setActiveSection] = useState('accueil');

            const navLinks = [
                { name: 'Accueil', id: 'accueil' },
                { name: 'À propos', id: 'apropos' },
                { name: 'Compétences', id: 'competences' },
                { name: 'Expérience', id: 'experience' },
                { name: 'Formation', id: 'formation' },
                { name: 'Contact', id: 'contact' },
            ];

            useEffect(() => {
                const handleScroll = () => {
                    const sections = navLinks.map(link => document.getElementById(link.id));
                    const scrollPosition = window.scrollY + 100;
                    sections.forEach(section => {
                        if (section) {
                            const sectionTop = section.offsetTop;
                            const sectionHeight = section.offsetHeight;
                            if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
                                setActiveSection(section.id);
                            }
                        }
                    });
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    const offset = 80;
                    const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
                    window.scrollTo({ top: elementPosition - offset, behavior: 'smooth' });
                }
                setIsMenuOpen(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans">
                    {/* Navigation */}
                    <nav className="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-20 items-center">
                                <div className="flex-shrink-0 font-bold text-xl tracking-tight text-blue-900">
                                    Elisiane <span className="text-slate-500 font-medium">KOM FEUM</span>
                                </div>
                                <div className="hidden md:block">
                                    <div className="ml-10 flex items-baseline space-x-8">
                                        {navLinks.map((link) => (
                                            <button key={link.id} onClick={() => scrollToSection(link.id)}
                                                className={`px-3 py-2 text-sm font-medium transition-colors ${activeSection === link.id ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-600 hover:text-blue-600'}`}>
                                                {link.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="md:hidden">
                                    <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 text-slate-600">
                                        <Icon name={isMenuOpen ? "x" : "menu"} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20">
                        {/* Hero Section */}
                        <section id="accueil" className="relative py-20 lg:py-32 overflow-hidden bg-white text-center lg:text-left">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
                                <div className="lg:flex lg:items-center lg:justify-between">
                                    <div className="lg:w-2/3">
                                        <span className="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 mb-6">Yaoundé, Cameroun</span>
                                        <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-900 mb-6">
                                            Elisiane KOM FEUM <br /> <span className="text-blue-600">Epse POKAM</span>
                                        </h1>
                                        <p className="text-xl font-semibold text-slate-600 mb-8">Assistante Administrative & Spécialiste en Relations Internationales</p>
                                        <div className="flex flex-wrap gap-4 justify-center lg:justify-start">
                                            <button onClick={() => scrollToSection('contact')} className="px-8 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all">Me contacter</button>
                                            <button onClick={() => scrollToSection('experience')} className="px-8 py-4 bg-white text-slate-700 font-bold rounded-xl border border-slate-200 hover:border-blue-600 hover:text-blue-600 transition-all">Parcours</button>
                                        </div>
                                    </div>
                                    <div className="hidden lg:block lg:w-1/3">
                                        <div className="bg-slate-100 rounded-3xl p-12 aspect-square flex items-center justify-center border border-slate-200 shadow-xl">
                                            <Icon name="user" size={120} className="text-blue-200" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Experience Highlights */}
                        <section id="apropos" className="py-24 bg-slate-50">
                            <div className="max-w-7xl mx-auto px-4 text-center mb-12">
                                <h2 className="text-3xl font-bold mb-4">À propos</h2>
                                <div className="w-20 h-1.5 bg-blue-600 mx-auto rounded-full"></div>
                                <p className="mt-8 text-lg text-slate-600 max-w-3xl mx-auto">
                                    Titulaire d'un <strong>Master II en Relations Internationales</strong> de l'IRIC, j'ai plus de 5 ans d'expérience en gestion administrative. Passionnée par l'innovation, je suis aussi formatrice en Intelligence Artificielle.
                                </p>
                            </div>
                        </section>

                        {/* Skills */}
                        <section id="competences" className="py-24 bg-white">
                            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="p-8 bg-slate-50 rounded-2xl border border-slate-100">
                                    <Icon name="file-text" className="text-blue-600 mb-4" />
                                    <h3 className="text-xl font-bold mb-2">Administration</h3>
                                    <p className="text-slate-600">Organisation de bureau, archivage et suivi de projets complexes.</p>
                                </div>
                                <div className="p-8 bg-slate-50 rounded-2xl border border-slate-100">
                                    <Icon name="brain-circuit" className="text-blue-600 mb-4" />
                                    <h3 className="text-xl font-bold mb-2">IA & Technologie</h3>
                                    <p className="text-slate-600">Maîtrise des outils génératifs et optimisation des processus par l'IA.</p>
                                </div>
                                <div className="p-8 bg-slate-50 rounded-2xl border border-slate-100">
                                    <Icon name="users" className="text-blue-600 mb-4" />
                                    <h3 className="text-xl font-bold mb-2">Leadership</h3>
                                    <p className="text-slate-600">Coordination d'équipes et mentorat institutionnel.</p>
                                </div>
                            </div>
                        </section>

                        {/* Contact */}
                        <section id="contact" className="py-24 bg-slate-900 text-white">
                            <div className="max-w-7xl mx-auto px-4 text-center">
                                <h2 className="text-3xl font-bold mb-8">Travaillons ensemble</h2>
                                <div className="flex flex-col md:flex-row gap-6 justify-center">
                                    <a href="mailto:elisianekom9@gmail.com" className="px-8 py-4 bg-blue-600 rounded-xl font-bold flex items-center justify-center gap-2 shadow-xl hover:bg-blue-700 transition-all">
                                        <Icon name="mail" size={20} /> elisianekom9@gmail.com
                                    </a>
                                    <a href="https://wa.me/237656502908" target="_blank" className="px-8 py-4 bg-green-600 rounded-xl font-bold flex items-center justify-center gap-2 shadow-xl hover:bg-green-700 transition-all">
                                        <Icon name="message-square" size={20} /> WhatsApp
                                    </a>
                                </div>
                                <p className="mt-12 text-slate-500">© {new Date().getFullYear()} Elisiane KOM FEUM Epse POKAM.</p>
                            </div>
                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
